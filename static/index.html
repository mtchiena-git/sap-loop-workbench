<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP Loop Workbench</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--ink:#1b1f24;--muted:#6b7280;--line:#e2e5ea;
  --accent:#0b57d0;--accent-ink:#fff;--ok:#1a7f37;--warn:#b7791f;--bad:#c2410c;--blocked:#9333ea;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e6e8ec;--muted:#9aa3b2;--line:#2a2f3a;--accent:#7aa7ff;--accent-ink:#0f1115}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--sans);background:var(--bg);color:var(--ink);display:grid;grid-template-columns:220px 1fr 340px;height:100vh;overflow:hidden}
aside,main,section.rail{overflow:auto}
aside{border-right:1px solid var(--line);padding:14px;background:var(--panel)}
section.rail{border-left:1px solid var(--line);padding:14px;background:var(--panel)}
main{padding:18px 24px}
h1{font-size:15px;margin:0 0 10px;letter-spacing:.02em}
h2{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:14px;margin:12px 0 6px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;min-height:220px;resize:vertical}
textarea.short{min-height:90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.proj{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between}
.proj.active{background:var(--bg);font-weight:600}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.blocked{color:var(--blocked);border-color:var(--blocked)}
.badge.accent{color:var(--accent);border-color:var(--accent)}
/* pipeline */
.pipe{display:flex;align-items:center;gap:0;margin:10px 0 18px;overflow-x:auto}
.stage{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);white-space:nowrap;color:var(--muted)}
.stage.cur{border-color:var(--accent);color:var(--accent);font-weight:600}
.stage.past{color:var(--ok);border-color:var(--ok)}
.gate{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;margin:0 6px;color:var(--muted);flex:none}
.gate.ok{border-color:var(--ok);color:var(--ok)}
.gate.wait{border-color:var(--warn);color:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(183,121,31,.15)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tab{padding:6px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tab.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.it{cursor:pointer}
tr.detail td{background:var(--bg);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi div{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}
.banner{border-left:4px solid var(--blocked);background:color-mix(in srgb,var(--blocked) 8%,var(--panel));padding:10px 14px;border-radius:6px;margin-bottom:12px}
.banner.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.approval{border:1px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:10px}
pre{background:var(--bg);padding:8px;border-radius:6px;font-family:var(--mono);font-size:11.5px;max-height:160px;overflow:auto;white-space:pre-wrap;margin:6px 0}
svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.scen{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.poison{background:var(--blocked)}
.note{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.note b{color:var(--accent);margin-right:6px}
.phase{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<aside>
  <h1>SAP Loop Workbench</h1>
  <div class="small muted" id="cfg">…</div>
  <h2>專案</h2>
  <div id="projects"></div>
  <button class="primary" style="width:100%;margin-top:8px" onclick="newProject()">＋ 新專案</button>
  <h2>體驗提示</h2>
  <div class="small muted">
    人只在 4 個閘門出手，其餘讓迴圈跑。<br><br>
    想看「迴圈會停」：啟動時選一條「毒情境」。<br>
    想看「人在控制」：審批模式選「每輪」，然後拒絕一次。
  </div>
</aside>

<main id="main"><div class="muted">選一個專案，或建立新專案。</div></main>

<section class="rail">
  <h2>待審批 <span id="pendingCount" class="badge warn" style="display:none"></span></h2>
  <div id="approvals" class="small muted">無</div>
  <h2>觀察筆記</h2>
  <div id="notes"></div>
  <div class="row" style="margin-top:8px">
    <select id="noteRole" style="width:auto"><option value="observer">觀察員</option><option value="PM">PM</option><option value="dev">開發</option><option value="tester">測試</option></select>
    <input id="noteText" placeholder="如果是我會怎麼做…" onkeydown="if(event.key==='Enter')addNote()">
  </div>
</section>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok){const t=await r.json().catch(()=>({detail:r.statusText}));alert(t.detail||'錯誤');throw new Error(t.detail)}return r.json()};
const STAGES=[['prd','PRD'],['spec','系統規格'],['dev','開發 / 測試迴圈'],['release','放行'],['done','完成']];
let P=null, cur=null, run=null, tab='feature', openIt=null, samples={}, cfg={};

async function boot(){
  cfg=await api('/config');samples=await api('/samples');
  $('#cfg').textContent=`LLM: ${cfg.llm} · Executor: ${cfg.executor}`;
  await loadProjects();
  const es=new EventSource('/api/events');
  es.onmessage=e=>{const ev=JSON.parse(e.data);if(ev.kind==='hello')return;
    if(ev.kind==='iter'&&ev.project_id===cur){$('#livePhase')&&($('#livePhase').textContent=`第 ${ev.n} 輪 · ${ev.phase}`);if(ev.phase!=='done')return}
    if(ev.project_id===cur)refresh();else loadProjects();loadApprovals()};
}
async function loadProjects(){const ps=await api('/projects');$('#projects').innerHTML=ps.map(p=>`<div class="proj ${p.id===cur?'active':''}" onclick="open('${p.id}')"><span>${esc(p.name)}</span><span class="badge">${stageName(p.stage)}</span></div>`).join('')||'<div class="small muted">尚無專案</div>'}
const stageName=s=>(STAGES.find(x=>x[0]===s)||[,s])[1];
async function newProject(){const name=prompt('專案名稱','採購單狀態查詢 API');if(!name)return;const p=await api('/projects','POST',{name,prd:samples['PRD_po_status_api.md']||'',glossary:samples['glossary.md']||''});await loadProjects();open(p.id)}
async function open(id){cur=id;openIt=null;await refresh();loadProjects()}
async function refresh(){if(!cur)return;P=await api('/projects/'+cur);const active=P.runs.filter(r=>r.status!=='error').slice(-1)[0];run=active?await api('/runs/'+active.id):null;render();loadApprovals();renderNotes()}

function render(){
  const idx=STAGES.findIndex(s=>s[0]===P.stage);
  const g=n=>P.gates.filter(x=>x.gate===n&&x.status==='APPROVED').length>0;
  const gateEl=(n)=>`<div class="gate ${g(n)?'ok':(idx===n-1||(n===3&&P.stage==='dev'))?'wait':''}" title="${cfg.gates[n]}">G${n}</div>`;
  let pipe='';STAGES.forEach((s,i)=>{pipe+=`<div class="stage ${i<idx?'past':i===idx?'cur':''}">${s[1]}</div>`;if(i<4)pipe+=gateEl(i+1)});
  $('#main').innerHTML=`
    <div class="row"><h1 style="font-size:20px;margin:0" class="grow">${esc(P.name)}</h1>
      <span class="badge accent">${stageName(P.stage)}</span>
      <button class="small" onclick="delProject()">刪除</button></div>
    <div class="pipe">${pipe}</div>
    ${renderStage()}
    <div class="card"><h3>閘門紀錄</h3>${P.gates.length?`<table><tr><th>時間</th><th>閘門</th><th>結果</th><th>誰</th><th>說明</th></tr>${P.gates.map(x=>`<tr><td class="small muted">${x.ts.slice(5,16)}</td><td>G${x.gate} ${esc(cfg.gates[x.gate])}</td><td><span class="badge ${x.status==='APPROVED'?'ok':x.status==='REJECTED'?'bad':'warn'}">${x.status}</span></td><td>${esc(x.who)}</td><td class="small">${esc(x.note)}</td></tr>`).join('')}</table>`:'<div class="small muted">尚無</div>'}</div>`;
}
function renderStage(){
  switch(P.stage){
    case 'prd':return `
      <div class="card"><h3>階段 0 · PRD（人寫）</h3>
        <div class="small muted" style="margin-bottom:8px">第 6 段驗收條件請用範例寫，不要用形容詞——它會變成迴圈的終止條件。</div>
        <div class="row" style="margin-bottom:6px"><b class="grow">PRD</b><button class="small" onclick="loadSample('prd')">載入範本</button></div>
        <textarea id="prd">${esc(P.prd)}</textarea>
        <div class="row" style="margin:10px 0 6px"><b class="grow">業務詞彙表</b><button class="small" onclick="loadSample('glossary')">載入範本</button></div>
        <textarea id="glossary" class="short">${esc(P.glossary)}</textarea>
        <div class="row" style="margin-top:10px"><button onclick="savePrd()">儲存</button></div></div>
      ${gateCard(1,'PRD 定稿：PM + 開發 + Key User 開 Three Amigos，把驗收條件改成 Given/When/Then 後通過。通過後 agent 自動產生系統規格。')}`;
    case 'spec':{const s=P.spec;const gen=!s.feature&&!s.openapi;return `
      <div class="card"><h3>階段 1 · 系統規格（agent 產生，人審）</h3>
        ${gen?'<div class="banner">agent 產生中…（gateway 模式約 30–90 秒）</div>':''}
        <div class="tabs">${['feature','openapi','tech_spec'].map(t=>`<div class="tab ${tab===t?'on':''}" onclick="tab='${t}';render()">${{feature:'Gherkin 情境',openapi:'OpenAPI',tech_spec:'Tech Spec'}[t]}</div>`).join('')}</div>
        <textarea id="specText" style="min-height:360px">${esc(s[tab])}</textarea>
        <div class="row" style="margin-top:10px"><button onclick="saveSpec()">儲存此頁</button><button onclick="regen()">重新產生</button>
          <span class="grow"></span><span class="small muted">情境數：${P.scenarios.length}</span></div>
        <div style="margin-top:10px">${P.scenarios.map(x=>`<div class="scen"><span class="dot"></span>${esc(x)}</div>`).join('')}</div></div>
      ${gateCard(2,'規格核准：開發審 Tech Spec，PM 審 Gherkin。通過後 feature 凍結，成為迴圈的 done 條件；要改必須回到這個閘門。')}`;}
    case 'dev':return renderDev();
    case 'release':return `${renderDev(true)}${gateCard(4,'TR 放行：全綠 + ATC 報告 + 情境結果附在 TR 審核紀錄。')}`;
    case 'done':return `<div class="banner ok">專案完成。到放行階段的結果如下。</div>${renderDev(true)}`;
  }
}
function gateCard(n,desc){return `<div class="card" style="border-color:var(--warn)"><h3>閘門 ${n} · ${esc(cfg.gates[n])}</h3><div class="small muted" style="margin-bottom:8px">${desc}</div>
  <div class="row"><input id="g${n}who" placeholder="誰" style="width:120px"><input id="g${n}note" placeholder="說明（選填）" class="grow"><button class="primary" onclick="gate(${n},true)">通過</button><button class="danger" onclick="gate(${n},false)">退回</button></div></div>`}

function renderDev(readonly=false){
  const running=run&&['running','waiting_approval'].includes(run.status);
  const its=run?run.iterations:[];const last=its.slice(-1)[0];const v=last?last.verify:{};
  const hist=run?run.state.history||[]:[];
  const total=P.scenarios.length;
  const tokens=its.reduce((a,i)=>a+i.tokens,0),secs=its.reduce((a,i)=>a+i.seconds,0);
  const passedNames=new Set();if(v.failures){const f=new Set(v.failures.map(x=>x.scenario));P.scenarios.forEach(s=>{if(!f.has(s))passedNames.add(s)})}
  const poison=run?run.state.poison_scenario:null;
  let banner='';
  if(run&&run.status==='blocked')banner=`<div class="banner"><b>迴圈停了（BLOCKED）</b><br>${esc(run.reason)}<br><span class="small muted">這就是終止條件在起作用：agent 不瞎做。PM 與開發判定要改規格（解凍回閘門 2）還是改程式（重啟迴圈）。</span></div>`;
  else if(run&&run.status==='done')banner=`<div class="banner ok"><b>迴圈完成</b> · ${esc(run.reason)}</div>`;
  else if(run&&run.status==='stopped')banner=`<div class="banner" style="border-color:var(--warn)"><b>迴圈停止</b> · ${esc(run.reason)}</div>`;
  else if(run&&run.status==='waiting_approval')banner=`<div class="banner" style="border-color:var(--warn)"><b>等待寫入審批（閘門 3）</b> · 右側待審批清單 → 核准後 agent 才會把物件寫進 D01。</div>`;
  const chart=svgChart(hist,total);
  return `
    ${!readonly&&!running?`<div class="card"><h3>階段 2–3 · 啟動開發/測試迴圈</h3>
      <div class="row">
        <label>回合上限 <input id="maxIter" type="number" value="20" style="width:70px"></label>
        <label>無進展上限 <input id="npl" type="number" value="3" style="width:60px"></label>
        <label>寫入審批 <select id="appMode" style="width:auto"><option value="first">第一輪（建物件時）</option><option value="every">每輪</option><option value="auto">自動（示範用）</option></select></label>
        <label>毒情境 <select id="poison" style="width:auto"><option value="">無</option>${P.scenarios.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
        <label>每輪秒數 <input id="spi" type="number" value="2" step="0.5" style="width:60px"></label>
        <button class="primary" onclick="startLoop()">▶ 啟動迴圈</button>
        ${P.spec.frozen?`<button class="small" onclick="unfreeze()">解凍規格（回閘門 2）</button>`:''}
      </div>
      <div class="small muted" style="margin-top:8px">迴圈規則（LOOP.md）：每輪只做一件事 → 寫入（經審批）→ 語法 / ABAP Unit / ATC / 情境 → 失敗帶實際值回修。停止：全綠、連續 N 輪無進展、回合上限。</div></div>`:''}
    ${banner}
    <div class="card"><div class="row"><h3 class="grow" style="margin:0">迴圈儀表板 ${run?`<span class="badge ${run.status==='done'?'ok':run.status==='blocked'?'blocked':running?'warn':''}">${run.status}</span>`:''}</h3>
      ${running?`<span id="livePhase" class="phase muted">第 ${run.iteration} 輪</span><button class="danger small" onclick="stopLoop()">停止</button>`:''}</div>
      <div class="kpi" style="margin-top:10px">
        <div><b>${run?run.iteration:0}<span class="muted" style="font-size:13px"> / ${run?run.max_iter:'-'}</span></b><span>回合</span></div>
        <div><b>${v.scen_pass??0}<span class="muted" style="font-size:13px"> / ${total}</span></b><span>情境通過</span></div>
        <div><b>${v.unit_pass??'-'}<span class="muted" style="font-size:13px"> / ${v.unit_total??'-'}</span></b><span>ABAP Unit</span></div>
        <div><b>${v.atc_p1??'-'}<span class="muted" style="font-size:13px"> P1 · ${v.atc_p2??'-'} P2</span></b><span>ATC</span></div>
      </div>
      ${chart}
      <div class="row small muted"><span>Token（估）${tokens.toLocaleString()}</span><span>· 耗時 ${secs.toFixed(0)}s</span><span>· 人工介入 ${P.gates.filter(g=>g.gate===3).length} 次（閘門 3）</span></div>
      <div style="margin-top:10px;columns:2">${P.scenarios.map(s=>`<div class="scen"><span class="dot ${s===poison?'poison':passedNames.has(s)?'ok':last?'bad':''}"></span>${esc(s)}${s===poison?' <span class="badge blocked">毒</span>':''}</div>`).join('')}</div>
    </div>
    <div class="card"><h3>迴圈紀錄（點開看每輪）</h3>
      ${its.length?`<table><tr><th>#</th><th>Plan</th><th>驗證</th><th>Revise</th><th>秒</th></tr>${its.map(i=>`
        <tr class="it" onclick="openIt=openIt===${i.n}?null:${i.n};render()"><td>${i.n}</td><td class="small">${esc(i.plan).slice(0,60)}</td>
        <td>${i.verify.skipped?'<span class="badge warn">未寫入</span>':`<span class="badge ${i.verify.scen_pass===i.verify.scen_total?'ok':''}">${i.verify.scen_pass}/${i.verify.scen_total}</span> ${i.verify.syntax_ok===false?'<span class="badge bad">語法</span>':''} ${i.verify.atc_p1?`<span class="badge bad">P1×${i.verify.atc_p1}</span>`:''}`}</td>
        <td class="small">${esc(i.revise).slice(0,70)}</td><td class="small muted">${i.seconds}</td></tr>
        ${openIt===i.n?`<tr class="detail"><td colspan="5"><b>Plan</b>\n${esc(i.plan)}\n\n<b>Action（程式片段）</b>\n${esc(i.action)}\n\n<b>Verify</b>\n${esc(JSON.stringify(i.verify,null,1))}\n\n<b>Revise</b>\n${esc(i.revise)}</td></tr>`:''}`).join('')}</table>`:'<div class="small muted">尚未執行</div>'}</div>`;
}
function svgChart(hist,total){
  const W=640,H=150,pl=34,pb=24,n=Math.max(hist.length,2);
  const x=i=>pl+(i/(n-1))*(W-pl-10),y=v=>H-pb-(total?v/total:0)*(H-pb-14);
  const pts=hist.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:170px;display:block;margin:6px 0 8px">
    <line x1="${pl}" y1="${y(0)}" x2="${W-10}" y2="${y(0)}" stroke="var(--line)"/>
    <line x1="${pl}" y1="${y(total)}" x2="${W-10}" y2="${y(total)}" stroke="var(--ok)" stroke-dasharray="4 4"/>
    <text x="${pl-6}" y="${y(total)+4}" text-anchor="end">${total}</text><text x="${pl-6}" y="${y(0)+4}" text-anchor="end">0</text>
    <text x="${W-10}" y="${y(total)-4}" text-anchor="end" fill="var(--ok)">done 條件</text>
    ${hist.length?`<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/>`:''}
    ${hist.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--accent)"/><text x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}</text>`).join('')}
    <text x="${pl}" y="12">情境通過數 / 回合</text></svg>`;
}

// ---- actions
async function savePrd(){await api('/projects/'+cur,'PATCH',{prd:$('#prd').value,glossary:$('#glossary').value});refresh()}
function loadSample(k){if(k==='prd')$('#prd').value=samples['PRD_po_status_api.md'];else $('#glossary').value=samples['glossary.md']}
async function gate(n,approve){if(n===1)await savePrd();const who=$(`#g${n}who`).value,note=$(`#g${n}note`).value;if(!who)return alert('請填誰通過的——人出手的紀錄是體驗的一部分');await api(`/projects/${cur}/gate/${n}`,'POST',{who,note,approve});refresh();loadProjects()}
async function saveSpec(){const b={};b[tab]=$('#specText').value;await api('/projects/'+cur+'/spec','PATCH',b);refresh()}
async function regen(){await api('/projects/'+cur+'/spec/regenerate','POST');refresh()}
async function unfreeze(){if(!confirm('解凍會回到閘門 2，並留下紀錄。確定？'))return;await api('/projects/'+cur+'/spec/unfreeze','POST');refresh();loadProjects()}
async function startLoop(){await api(`/projects/${cur}/loop/start`,'POST',{max_iter:+$('#maxIter').value,no_progress_limit:+$('#npl').value,approval_mode:$('#appMode').value,poison_scenario:$('#poison').value,seconds_per_iter:+$('#spi').value});refresh()}
async function stopLoop(){await api('/runs/'+run.id+'/stop','POST')}
async function delProject(){if(!confirm('刪除專案與所有紀錄？'))return;await api('/projects/'+cur,'DELETE');cur=null;P=null;$('#main').innerHTML='<div class="muted">選一個專案。</div>';loadProjects()}

// ---- approvals / notes
async function loadApprovals(){const a=await api('/approvals?status=PENDING');$('#pendingCount').style.display=a.length?'':'none';$('#pendingCount').textContent=a.length;
  $('#approvals').innerHTML=a.length?a.map(x=>`<div class="approval"><div class="row"><b class="grow">${esc(x.object_name)}</b><span class="badge warn">第 ${x.iteration} 輪</span></div>
    <div class="small muted">${x.object_type} · ${x.created.slice(11,16)}</div><pre>${esc(x.payload)}</pre>
    <input id="aw${x.id}" placeholder="誰" style="margin-bottom:4px"><input id="an${x.id}" placeholder="意見（拒絕時 agent 會看到）" style="margin-bottom:6px">
    <div class="row"><button class="primary" onclick="decide('${x.id}',true)">核准寫入</button><button class="danger" onclick="decide('${x.id}',false)">拒絕</button></div></div>`).join(''):'<span class="small muted">無</span>'}
async function decide(id,approve){const who=$('#aw'+id).value,note=$('#an'+id).value;if(!who)return alert('請填誰決定的');await api('/approvals/'+id,'POST',{approve,who,note});loadApprovals()}
function renderNotes(){$('#notes').innerHTML=(P?.notes||[]).map(n=>`<div class="note"><b>${esc(n.role)}</b>${esc(n.text)}<div class="small muted">${n.ts.slice(5,16)}</div></div>`).join('')||'<span class="small muted">觀察員在這裡記「如果是我會怎麼做、agent 做了什麼不一樣」</span>'}
async function addNote(){if(!cur)return alert('先選專案');const t=$('#noteText').value.trim();if(!t)return;await api('/projects/'+cur+'/notes','POST',{role:$('#noteRole').value,text:t});$('#noteText').value='';refresh()}
boot();
</script>
</body>
