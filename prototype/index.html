// ---------- samples
const SAMPLE_PRD=`# PRD：採購單狀態查詢 API（Pilot）

## 1. 背景
外部物流系統需要用採購單號查詢交貨狀態，目前靠人工在 ME23N 查後回報。

## 2. 目標
提供外部系統兩個能力：(a) 用採購單號查詢抬頭、項目與交貨狀態；(b) 對一張採購單寫入一筆備註。
（介面形式、路徑、方法由系統規格階段決定，PRD 不定義。）

## 3. 使用者
物流系統（技術使用者）、採購 PM。

## 4. 範圍
- 做：讀 EKKO/EKPO，計算 OPEN / PARTIAL / DELIVERED / CLOSED；備註寫入 Z-table
- 不做：OData、Fiori、修改標準程式、效能調校

## 5. 業務規則
- 所有項目 ELIKZ → DELIVERED；部分收貨 → PARTIAL；未收貨 → OPEN；刪除旗標 → CLOSED
- 查詢需 M_BEST_EKO 顯示權限；寫備註需變更權限
- 備註 1–255 字，空白拒絕

## 6. 資料需求（業務語言；英文名與型別由 agent 補到欄位表）
### 輸入
| 資料 | 業務意義 | 必填 | 範例 | 規則 |
|---|---|---|---|---|
| 採購單號 | 要查的 PO | 是 | 4500000001 | 10 碼數字 |
| 備註內容 | 外部系統要記的文字 | 是（寫備註時） | 請加速交貨 | 1–255 字 |

### 輸出（查詢）
| 資料 | 業務意義 | 範例 | 來源 / 規則 |
|---|---|---|---|
| 採購單號 | 同輸入 | 4500000001 | |
| 供應商 | 下單對象 | V-TEST-01 | 供應商代碼，不回名稱 |
| 交貨狀態 | 整張單的收貨進度 | 部分收 | 未收 / 部分收 / 已收完 / 已關閉，規則見 §5 |
| 項目清單 | 每行物料的收貨情形 | 2 筆 | 每筆：項目號、物料、訂購量、已收量、是否收貨完成 |

### 不回傳
價格、條件、審批紀錄（物流系統不該看到）

## 7. 驗收條件（用範例寫，不用形容詞）
- 項目 10 已收、項目 20 未收的單 → 交貨狀態=部分收、項目 2 筆
- 不存在的單 → 404、錯誤碼 PO_NOT_FOUND
- 單號非 10 碼數字 → 400
- 無權限使用者 → 403
- 寫備註「請加速交貨」→ 201，ZPO_NOTE 多一筆
- 寫空白備註 → 400，ZPO_NOTE 不增加

## 8. 風險與依賴
- 測試資料：固定測試採購單 4500000001 / 4500000002
- 授權：測試使用者需有權 / 無權兩組角色`;
const SAMPLE_GLOSS=`| 詞彙 | 定義 | SAP 對應 |
|---|---|---|
| 採購單 / PO | 向供應商下的採購憑證 | EKKO / EKPO |
| 項目 | 採購單內的一行物料 | EKPO-EBELP |
| 交貨狀態 | OPEN / PARTIAL / DELIVERED / CLOSED | ELIKZ、WEMNG、LOEKZ 推算 |
| 已收貨量 | 已過帳收貨的數量 | EKET-WEMNG |
| 備註 | 外部系統對採購單的文字註記 | ZPO_NOTE |`;
const SPEC_FEATURE=`Feature: 採購單狀態查詢 API
  讓外部系統用單號查詢採購單抬頭、項目與交貨狀態，並可寫入備註。

  Background:
    Given 測試採購單 "4500000001" 存在，供應商 "V-TEST-01"，公司代碼 "1000"
    And 該採購單有 2 個項目，項目 10 已全數收貨，項目 20 尚未收貨

  Scenario: 查詢存在的採購單
    When 呼叫 GET /po/4500000001
    Then 回應狀態碼為 200
    And 回應欄位 status 為 "PARTIAL"
    And 回應包含 2 個 items
    And items[0].elikz 為 true

  Scenario: 查詢不存在的採購單
    When 呼叫 GET /po/4599999999
    Then 回應狀態碼為 404
    And 回應欄位 error 為 "PO_NOT_FOUND"

  Scenario: 單號格式錯誤
    When 呼叫 GET /po/ABC
    Then 回應狀態碼為 400

  Scenario: 無權限的使用者查詢
    Given 呼叫者沒有授權物件 M_BEST_EKO
    When 呼叫 GET /po/4500000001
    Then 回應狀態碼為 403

  Scenario: 新增備註成功
    When 呼叫 POST /po/4500000001/note，內容 {"text": "請加速交貨"}
    Then 回應狀態碼為 201
    And 資料表 ZPO_NOTE 有一筆 EBELN = "4500000001" 且 NOTE_TEXT = "請加速交貨"

  Scenario: 備註文字空白
    When 呼叫 POST /po/4500000001/note，內容 {"text": ""}
    Then 回應狀態碼為 400
    And 資料表 ZPO_NOTE 沒有新增任何資料

  Scenario: 對不存在的採購單新增備註
    When 呼叫 POST /po/4599999999/note，內容 {"text": "x"}
    Then 回應狀態碼為 404

  Scenario: 全數收貨的採購單狀態
    Given 測試採購單 "4500000002" 存在且所有項目已全數收貨
    When 呼叫 GET /po/4500000002
    Then 回應欄位 status 為 "DELIVERED"`;
const SPEC_OPENAPI=`openapi: 3.0.3
info: { title: Z PO Status API, version: 0.1.0 }
servers: [ { url: /sap/bc/zapi } ]
paths:
  /po/{ebeln}:
    get:
      summary: 查詢採購單狀態
      parameters:
        - { name: ebeln, in: path, required: true, schema: { type: string, maxLength: 10 } }
      responses:
        '200': { description: 抬頭 + 項目 + 交貨狀態, content: { application/json: { schema: { $ref: '#/components/schemas/PoStatus' } } } }
        '400': { description: 單號格式錯誤 }
        '403': { description: 無 M_BEST_EKO 權限 }
        '404': { description: 採購單不存在 }
  /po/{ebeln}/note:
    post:
      summary: 新增備註（寫入 ZPO_NOTE）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 255 } } } } }
      responses:
        '201': { description: 已建立 }
        '400': { description: text 空白或超長 }
        '403': { description: 無權限 }
        '404': { description: 採購單不存在 }
components:
  schemas:
    PoStatus:
      type: object
      properties:
        ebeln: { type: string }
        lifnr: { type: string }
        bukrs: { type: string }
        status: { type: string, enum: [OPEN, PARTIAL, DELIVERED, CLOSED] }
        items:
          type: array
          items: { type: object, properties: { ebelp: { type: string }, matnr: { type: string }, menge: { type: number }, wemng: { type: number }, elikz: { type: boolean } } }`;
const SPEC_TECH=`# Tech Spec — Z PO Status API

## SICF
- 節點：/sap/bc/zapi/po
- Handler：ZCL_ZAPI_PO_HTTP（IF_HTTP_EXTENSION），只做路由與序列化
- 路由：PATH_INFO /{ebeln} → GET；/{ebeln}/note → POST

## 物件
| 物件 | 類型 | 說明 |
|---|---|---|
| ZCL_ZAPI_PO_HTTP | Class | HTTP handler |
| ZCL_PO_STATUS_SRV | Class | 業務邏輯：讀 EKKO/EKPO，計算 status |
| ZPO_NOTE | Table | EBELN, SEQNO, NOTE_TEXT, ERNAM, ERDAT, ERZET |
| ZCL_ZAPI_PO_HTTP_TEST | Test class | ABAP Unit，OSQL test double |

## 狀態規則
- 所有項目 ELIKZ = X → DELIVERED
- 任一項目 WEMNG > 0 但非全部 ELIKZ → PARTIAL
- 全部 WEMNG = 0 → OPEN
- EKKO-LOEKZ = L → CLOSED

## 授權
- 讀：AUTHORITY-CHECK OBJECT 'M_BEST_EKO' ACTVT '03'
- 寫：ACTVT '02'

## 錯誤處理
- body: {"error": "<CODE>", "message": "<text>"}
- PO_NOT_FOUND / INVALID_EBELN / NO_AUTH / INVALID_TEXT

## 測試資料
- 固定前綴 45000000xx，由 Given 以 BAPI_PO_CREATE1 建立或直接 INSERT
- 每輪 run id 寫入 ZPO_NOTE.ERNAM 供清理`;

function gate(n,approve){const p=cp();const who=$(`#g${n}who`).value.trim(),note=$(`#g${n}note`).value.trim();

  p.gates.push({gate:n,status:approve?'APPROVED':'REJECTED',who,note,ts:now()});
  if(approve){if(n===1&&p.stage==='prd'){p.stage='spec';if(p.spec.fields.length){S.tab='endpoints';toast('沿用既有規格；需要重生請按「重新產生」')}else generateSpec(p)}else if(n===2&&p.stage==='spec'){p.spec.frozen=true;p.stage='dev'}else if(n===4&&p.stage==='release'){p.stage='done'}}

function rollback(target,presetNote){const p=cp();const from=p.stage;const to=target||PREV[from];if(!to)return;
  const who=($('#rbWho')?.value||'').trim(),note=presetNote||($('#rbNote')?.value||'').trim();
  if(!who&&!presetNote)return toast('請填誰退回的');if(!note)return toast('請寫退回原因，紀錄會留在閘門紀錄');
  const r=currentRun(p);if(running(r))return toast('迴圈執行中，請先停止再退回');
  // stage-specific side effects
  if(from==='dev'||from==='release'||from==='done'){if(to==='spec'||to==='prd')p.spec.frozen=false}
  const gateOf={prd:1,spec:2,dev:3,release:4};
  p.gates.push({gate:gateOf[to]||0,status:'ROLLBACK',who,note:`${stageName(from)} → ${stageName(to)}：${note}`,ts:now()});

  return `<div class="card" style="border-style:dashed"><div class="row"><h3 class="grow" style="margin:0">↩ 退回上一步（${stageName(p.stage)} → ${stageName(to)}）</h3>${S.rb?'':`<button class="sm" id="btnRbOpen" ${running(r)?'disabled title="迴圈執行中"':''}>退回</button>`}</div>
    ${S.rb?`<div class="small muted" style="margin:6px 0 8px">${hint}</div><div class="row"><input id="rbWho" placeholder="誰" style="width:120px"><input id="rbNote" class="grow" placeholder="退回原因（必填，會留在閘門紀錄）"><button class="danger" id="btnRbGo">確認退回</button><button class="sm" id="btnRbCancel">取消</button></div>`:''}</div>`}

// loop
function startLoop(){const p=cp();const scen=parseScenarios(p.spec.feature);
  const run={id:uid(),status:'running',iteration:0,max_iter:+$('#maxIter').value||20,npl:+$('#npl').value||3,approval_mode:$('#appMode').value,poison:$('#poison').value||null,spi:(+$('#spi').value||2)*1000,history:[],iterations:[],scen_pass:0,best:0,no_progress:0,reason:'',phase:'',stop:false,started:now()};
  p.runs.push(run);rnd=mulberry(7);render();step(p,run)}
function stopLoop(){const r=currentRun(cp());if(r)r.stop=true}
function currentRun(p){return p&&p.runs.length?p.runs[p.runs.length-1]:null}
function running(r){return r&&['running','waiting_approval'].includes(r.status)}
function verify(run,n,scen){const total=scen.length;const prev=run.scen_pass;let gain=n>1?[1,1,2,2,0][Math.floor(rnd()*5)]:1;if(n===3&&prev>1)gain=-1;
  const cap=total-(run.poison?1:0);const passed=Math.max(0,Math.min(cap,prev+gain));const failures=[];
  scen.forEach((s,i)=>{if(i>=passed){if(s===run.poison)failures.push({scenario:s,expected:'status 200 且 404 同時成立',actual:'矛盾的 Then — 無法同時滿足'});else failures.push({scenario:s,expected:'HTTP 200 / 欄位值符合',actual:FAILS[Math.floor(rnd()*FAILS.length)]})}});
  // poison scenario sits last in failures only if it's genuinely the remaining one
  if(run.poison&&passed===cap){failures.length=0;failures.push({scenario:run.poison,expected:'status 200 且 404 同時成立',actual:'矛盾的 Then — 無法同時滿足'})}
  const ut=6+total;return{syntax_ok:n>1||rnd()>0.3,unit_pass:Math.min(ut,3+passed+Math.floor(n/2)),unit_total:ut,atc_p1:Math.max(0,2-Math.floor(n/2)),atc_p2:Math.max(0,5-n),scen_pass:passed,scen_total:total,failures}}
function finish(p,run,status,reason){run.status=status;run.reason=reason;run.ended=now();if(status==='done')p.stage='release';render();toast(status==='done'?'迴圈完成：全綠':status==='blocked'?'迴圈 BLOCKED，等人判定':'迴圈停止')}
function step(p,run){if(run.stop)return finish(p,run,'stopped','人工停止');if(run.iteration>=run.max_iter)return finish(p,run,'stopped',`達到回合上限 ${run.max_iter}`);
  const n=++run.iteration;const scen=parseScenarios(p.spec.feature);const t0=Date.now();
  const plan=n===1?'建立 ZCL_ZAPI_PO_HTTP、ZPO_NOTE 與測試類別骨架；先讓路由與 400 分支通過。':`針對目前失敗的第一條情境修正 handler；先跑測試確認失敗再改程式。`;
  const obj=n===1?'ZCL_ZAPI_PO_HTTP + ZPO_NOTE + ZCL_ZAPI_PO_HTTP_TEST':'ZCL_ZAPI_PO_HTTP';
  run.phase='plan';render();
  setTimeout(()=>{run.phase='act';render();
    const need=run.approval_mode==='every'||(run.approval_mode==='first'&&n===1);
    const after=(decision,note)=>{
      if(decision==='REJECTED'){const v={skipped:true,scen_pass:run.scen_pass,scen_total:scen.length,failures:[]};run.no_progress++;
        run.iterations.push({n,plan,action:CODE_SNIPPET,verify:v,revise:`寫入被拒絕：${note||'（無說明）'}。本輪不寫入，依意見調整後下一輪重送。`,seconds:((Date.now()-t0)/1000).toFixed(1),tokens:1400});
        if(run.no_progress>=run.npl)return finish(p,run,'blocked',`連續 ${run.no_progress} 輪無進展（寫入持續被拒）`);
        render();return setTimeout(()=>step(p,run),400)}
      run.phase='verify';render();
      setTimeout(()=>{const v=verify(run,n,scen);run.scen_pass=v.scen_pass;run.history.push(v.scen_pass);
        const revise=v.failures.length?REVISES[(n-1)%REVISES.length]:'';
        run.iterations.push({n,plan,action:CODE_SNIPPET,verify:v,revise,seconds:((Date.now()-t0)/1000).toFixed(1),tokens:1600+Math.floor(rnd()*600)});
        if(v.scen_pass===v.scen_total&&v.atc_p1===0&&v.syntax_ok)return finish(p,run,'done',`全綠：${v.scen_total}/${v.scen_total} 情境、ATC P1=0`);
        if(v.scen_pass>run.best){run.best=v.scen_pass;run.no_progress=0}else run.no_progress++;
        if(run.no_progress>=run.npl){const f=v.failures[0]||{};return finish(p,run,'blocked',`BLOCKED：連續 ${run.no_progress} 輪通過數未增加。卡住的情境：「${f.scenario||'?'}」。期望：${f.expected||''}；實際：${f.actual||''}。判斷為規格與程式矛盾或缺少資訊，需要人判定要改規格還是改程式。`)}
        render();setTimeout(()=>step(p,run),300)},run.spi)};
    if(need){run.status='waiting_approval';const a={id:uid(),run_id:run.id,iteration:n,object:obj,type:'CLAS',payload:CODE_SNIPPET,status:'PENDING',created:now(),_cb:(d,note)=>{run.status=run.stop?'running':'running';after(d,note)}};p.approvals.unshift(a);render()}
    else after('APPROVED','')},500)}
function decide(id,approve){const p=cp();const a=p.approvals.find(x=>x.id===id);if(!a||a.status!=='PENDING')return;
  const who=$('#aw'+id).value.trim(),note=$('#an'+id).value.trim();if(!who)return toast('請填誰決定的');
  a.status=approve?'APPROVED':'REJECTED';a.who=who;a.note=note;a.decided=now();
  p.gates.push({gate:3,status:a.status,who,note:`${a.object}：${note}`,ts:now()});render();a._cb(a.status,note)}

// ---------- render
function render(){renderProjects();renderMain();renderApprovals();renderNotes()}
function renderProjects(){$('#projects').innerHTML=S.projects.map(p=>`<div class="proj ${p.id===S.cur?'active':''}" data-id="${p.id}"><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="badge">${stageName(p.stage)}</span></div>`).join('')||'<div class="small muted">尚無專案</div>';
  document.querySelectorAll('.proj').forEach(el=>el.onclick=()=>{S.cur=el.dataset.id;S.openIt=null;render()})}
function renderMain(){const p=cp();if(!p){$('#main').innerHTML='<div class="card"><h3>開始</h3><div class="muted">按左欄「＋ 新專案」，會載入範例 PRD（採購單狀態查詢 API），然後依序走 4 個閘門。</div></div>';return}

  $('#main').innerHTML=`<div class="row"><h1 style="font-size:19px;margin:0" class="grow">${esc(p.name)}</h1><span class="badge accent">${stageName(p.stage)}</span></div>

    <div class="card"><h3>閘門紀錄</h3>${p.gates.length?`<div class="tw"><table><tr><th>時間</th><th>閘門</th><th>結果</th><th>誰</th><th>說明</th></tr>${p.gates.map(x=>`<tr><td class="small muted">${x.ts.slice(5,16)}</td><td>${x.gate?`G${x.gate} ${esc(GATES[x.gate])}`:'—'}</td><td><span class="badge ${x.status==='APPROVED'?'ok':x.status==='REJECTED'?'bad':x.status==='ROLLBACK'?'blocked':'warn'}">${x.status}</span></td><td>${esc(x.who)}</td><td class="small">${esc(x.note)}</td></tr>`).join('')}</table></div>`:'<div class="small muted">尚無</div>'}</div>`;
  bindMain(p)}
function gateCard(n,desc){return `<div class="card gate"><h3>閘門 ${n} · ${esc(GATES[n])}</h3><div class="small muted" style="margin-bottom:8px">${desc}</div>

function renderStage(p){switch(p.stage){
  case 'prd':return `<div class="card"><h3>階段 0 · PRD（人寫）</h3><div class="small muted" style="margin-bottom:8px">第 6 段驗收條件請用範例寫，不要用形容詞——它會變成迴圈的終止條件。</div>
    <div class="row" style="margin-bottom:6px"><b class="grow">PRD</b><button class="sm" id="btnSamplePrd">載入範本</button></div><textarea id="prd">${esc(p.prd)}</textarea>
    <div class="row" style="margin:10px 0 6px"><b class="grow">業務詞彙表</b><button class="sm" id="btnSampleGloss">載入範本</button></div><textarea id="glossary" class="short">${esc(p.glossary)}</textarea></div>
    ${gateCard(1,'PRD 定稿：PM + 開發 + Key User 開 Three Amigos，把驗收條件改成 Given/When/Then 後通過。通過後 agent 自動產生系統規格。')}`;
  case 'spec':{const s=p.spec;const tabs={endpoints:'端點表',fields:'欄位表',feature:'Gherkin 情境',openapi:'OpenAPI（生成）',tech_spec:'Tech Spec'};const sc=parseScenarios(s.feature);const derived=S.tab==='openapi';return `<div class="card"><h3>階段 1 · 系統規格（agent 產生，人審）</h3>

    ${S.tab==='endpoints'?(s.endpoints.length?endpointsTab(p):'<div class="muted">等 agent 產生…</div>'):S.tab==='fields'?(s.fields.length?fieldsTab(p):'<div class="muted">等 agent 產生…</div>'):`<textarea id="specText" style="min-height:340px" ${s.frozen||derived?'readonly':''}>${esc(s[S.tab])}</textarea>
    <div class="row" style="margin-top:10px">${derived?'<span class="small muted">此檔由欄位表生成，要改請改欄位表。</span>':`<button id="btnSaveSpec" ${s.frozen?'disabled':''}>儲存此頁</button>`}<button id="btnRegen" ${s.frozen?'disabled':''}>重新產生</button><span class="grow"></span><span class="small muted">情境數：${sc.length}</span></div>
    ${S.tab==='feature'?`<div style="margin-top:10px" class="cols">${sc.map(x=>`<div class="scen"><span class="dot"></span>${esc(x)}</div>`).join('')}</div>`:''}`}</div>
    ${gateCard(2,'規格核准：開發審 Tech Spec，PM 審 Gherkin。通過後 feature 凍結，成為迴圈的 done 條件；要改必須回到這個閘門。')}`}
  case 'dev':return renderDev(p,false);
  case 'release':return renderDev(p,true)+gateCard(4,'TR 放行：全綠 + ATC 報告 + 情境結果附在 TR 審核紀錄。');
  case 'done':return '<div class="banner ok">專案完成。放行時的結果如下。</div>'+renderDev(p,true)}}
function renderDev(p,ro){const run=currentRun(p);const isRun=running(run);const its=run?run.iterations:[];const last=its[its.length-1];const v=last?last.verify:{};
  const hist=run?run.history:[];const scen=parseScenarios(p.spec.feature);const total=scen.length;
  const tokens=its.reduce((a,i)=>a+i.tokens,0),secs=its.reduce((a,i)=>a+ +i.seconds,0);
  const passed=new Set();if(v.failures){const f=new Set(v.failures.map(x=>x.scenario));scen.forEach(s=>{if(!f.has(s))passed.add(s)})}

  else if(run&&run.status==='waiting_approval')banner=`<div class="banner warn"><b>等待寫入審批（閘門 3）</b> · 右側待審批清單 → 核准後 agent 才會把物件寫進 D01。</div>`;
  return `${!ro&&!isRun?`<div class="card"><h3>階段 2–3 · 啟動開發/測試迴圈</h3><div class="row" style="align-items:flex-end">

      <div class="small muted" style="margin-top:8px">LOOP.md：每輪只做一件事 → 寫入（經審批）→ 語法 / ABAP Unit / ATC / 情境 → 失敗帶實際值回修。停止：全綠、連續 N 輪無進展、回合上限。</div></div>`:''}

      <tr class="it" data-n="${i.n}"><td>${i.n}</td><td class="small">${esc(i.plan).slice(0,48)}…</td>

function svgChart(hist,total){const W=640,H=150,pl=34,pb=24,n=Math.max(hist.length,2);const x=i=>pl+(i/(n-1))*(W-pl-14),y=v=>H-pb-(total?v/total:0)*(H-pb-18);

    ${hist.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--accent)"/><text x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}</text>`).join('')}

    <div class="row"><button class="primary" data-ap="${x.id}" data-ok="1">核准寫入</button><button class="danger" data-ap="${x.id}" data-ok="0">拒絕</button></div></div>`).join(''):'<span class="small muted">無</span>';
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(b.dataset.ap,b.dataset.ok==='1'))}
function renderNotes(){const p=cp();$('#notes').innerHTML=(p?p.notes:[]).map(n=>`<div class="note"><b>${esc(n.role)}</b>${esc(n.text)}<div class="small muted">${n.ts.slice(5,16)}</div></div>`).join('')||'<span class="small muted">觀察員在這裡記「如果是我會怎麼做、agent 做了什麼不一樣」</span>'}
$('#btnNew').onclick=newProject;
$('#noteText').onkeydown=e=>{if(e.key!=='Enter')return;const p=cp();if(!p)return toast('先選專案');const t=$('#noteText').value.trim();if(!t)return;p.notes.push({role:$('#noteRole').value,text:t,ts:now()});$('#noteText').value='';renderNotes()};
newProject();
</script>
